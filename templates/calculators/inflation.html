<!DOCTYPE html>
<html>
<head>
    <title>Inflation Calculator</title>
</head>
<body>
    <h1>Inflation Calculator</h1>
    <form method="post">
        {% csrf_token %}
        Current Amount: <input type="number" name="amount" step="0.01" required><br>
        Annual Inflation Rate (%): <input type="number" name="inflation" step="0.01" required><br>
        Number of Years: <input type="number" name="years" required><br>
        <input type="submit" value="Calculate">
    </form>
    {% if future_cost %}
    <h2>Results</h2>
    <p>Future Cost: {{ future_cost }}</p>
    <p>Purchasing Power: {{ purchasing_power }}</p>
    {% endif %}
</body>
</html>
