<!DOCTYPE html>
<html>
<head>
    <title>Dream Goal Calculator</title>
</head>
<body>
    <h1>Dream Goal Calculator</h1>
    <form method="post">
        {% csrf_token %}
        Goal Amount: <input type="number" name="goal_amount" step="0.01" required><br>
        Annual Interest Rate (%): <input type="number" name="rate" step="0.01" required><br>
        Number of Years: <input type="number" name="years" required><br>
        <input type="submit" value="Calculate">
    </form>
    {% if required_monthly_sip %}
    <h2>Results</h2>
    <p>Required Monthly SIP: {{ required_monthly_sip }}</p>
    {% endif %}
</body>
</html>
