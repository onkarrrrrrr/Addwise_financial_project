<!DOCTYPE html>
<html>
<head>
    <title>FD Calculator</title>
</head>
<body>
    <h1>Fixed Deposit Calculator</h1>
    <form method="post">
        {% csrf_token %}
        Investment Amount: <input type="number" name="investment" step="0.01" required><br>
        Annual Interest Rate (%): <input type="number" name="rate" step="0.01" required><br>
        Tenure (Years): <input type="number" name="years" step="0.01" required><br>
        <input type="submit" value="Calculate">
    </form>
    {% if maturity_amount %}
    <h2>Results</h2>
    <p>Maturity Amount: {{ maturity_amount }}</p>
    <p>Interest Earned: {{ interest_earned }}</p>
    {% endif %}
</body>
</html>
